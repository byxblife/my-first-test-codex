<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小轉盤</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        background: radial-gradient(circle at top, #ffe7d0, #ffcba4);
        min-height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        background: transparent;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        text-align: center;
        color: #4b2c20;
      }

      .wheel-wrapper {
        position: relative;
        width: min(90vw, 320px);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }

      #wheelCanvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.2);
        background: #fff5eb;
        transform: rotate(0deg);
      }

      .pointer {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-bottom: 26px solid #ff6b3d;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
      }

      .spin-button {
        padding: 0.75rem 2.75rem;
        border: none;
        border-radius: 999px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #ff8d5d, #ff5a2d);
        box-shadow: 0 10px 18px rgba(255, 90, 45, 0.35);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .spin-button:disabled {
        cursor: not-allowed;
        filter: grayscale(0.3);
        box-shadow: none;
      }

      .spin-button:not(:disabled):active {
        transform: scale(0.96);
      }

      .result {
        margin-top: 0.75rem;
        font-size: clamp(1.2rem, 4.5vw, 1.6rem);
        font-weight: 700;
        color: #4b2c20;
        min-height: 2.5rem;
        text-align: center;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        #wheelCanvas {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>今天來個什麼小挑戰？</h1>
    <div class="wheel-wrapper">
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
      <div class="pointer" aria-hidden="true"></div>
    </div>
    <button id="spinButton" class="spin-button">開始旋轉</button>
    <div id="result" class="result" role="status" aria-live="polite"></div>

    <script>
      const segments = {{ segments | tojson }};
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const spinButton = document.getElementById('spinButton');
      const resultEl = document.getElementById('result');

      const segmentAngle = (2 * Math.PI) / segments.length;
      const colors = [
        '#ff9f68',
        '#ffd270',
        '#ff7c7c',
        '#5ac7ff',
        '#9b8cff',
        '#68d391',
        '#ffa6c1',
        '#f6a5ff',
        '#6ee7b7',
        '#facc15'
      ];

      let currentRotation = 0;
      let spinning = false;

      function drawWheel(rotationDegrees = 0) {
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate((rotationDegrees * Math.PI) / 180);

        segments.forEach((label, index) => {
          const startAngle = index * segmentAngle - Math.PI / 2;
          const endAngle = startAngle + segmentAngle;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = colors[index % colors.length];
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.save();
          const textAngle = startAngle + segmentAngle / 2;
          ctx.rotate(textAngle);
          ctx.fillStyle = '#43291f';
          ctx.font = 'bold 32px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.translate(radius * 0.58, 0);
          ctx.rotate(Math.PI / 2);
          wrapText(ctx, label, 0, 0, radius * 0.6, 32);
          ctx.restore();
        });
        ctx.restore();
      }

      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split('');
        let line = '';
        const lines = [];
        words.forEach((char) => {
          const testLine = line + char;
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && line !== '') {
            lines.push(line);
            line = char;
          } else {
            line = testLine;
          }
        });
        lines.push(line);

        const offset = (-((lines.length - 1) * lineHeight)) / 2;
        lines.forEach((l, index) => {
          context.fillText(l, x, y + offset + index * lineHeight);
        });
      }

      function spinWheel() {
        if (spinning) return;
        spinning = true;
        spinButton.disabled = true;
        resultEl.textContent = '';

        const extraSpins = Math.floor(Math.random() * 4) + 8; // 8~11 full rotations
        const randomOffset = Math.random() * 360;
        const duration = Math.random() * 5 + 10; // 10~15 seconds
        const targetRotation = currentRotation + extraSpins * 360 + randomOffset;

        animateSpin(targetRotation, duration).then((finalRotation) => {
          currentRotation = finalRotation % 360;
          const normalized = (360 - (currentRotation % 360)) % 360;
          const selectedIndex = Math.floor(
            (normalized + (360 / segments.length) / 2) /
              (360 / segments.length)
          ) % segments.length;
          resultEl.textContent = `今天的安排：${segments[selectedIndex]}`;
          spinning = false;
          spinButton.disabled = false;
        });
      }

      function animateSpin(targetRotation, duration) {
        return new Promise((resolve) => {
          const start = performance.now();
          const initialRotation = currentRotation;
          const totalRotation = targetRotation - initialRotation;

          function step(timestamp) {
            const elapsed = (timestamp - start) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            const eased = easeOutCubic(progress);
            const current = initialRotation + totalRotation * eased;
            drawWheel(current);

            if (progress < 1) {
              requestAnimationFrame(step);
            } else {
              resolve(targetRotation);
            }
          }

          requestAnimationFrame(step);
        });
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      spinButton.addEventListener('click', spinWheel);
      drawWheel();
    </script>
  </body>
</html>
